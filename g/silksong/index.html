<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://raw.githubusercontent.com/indiamonda/silksong-data/main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Hollow Knight Silksong (FIXED loader)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script src="jszip.js"></script>
    <div id="save-tools" style="position:fixed;top:6px;right:6px;z-index:99999;display:none;">
      <button id="btn-export" style="margin:2px;padding:6px 10px;cursor:pointer;">💾 Export save</button>
      <button id="btn-import" style="margin:2px;padding:6px 10px;cursor:pointer;">📥 Import save</button>
      <button id="btn-skip" style="margin:2px;padding:6px 10px;cursor:pointer;">⚡ Skip softlock (import bundled save)</button>
      <input type="file" id="file-import" accept=".dat,.json" style="display:none;">
    </div>

<script>
const loadingText = document.querySelector("#loading-text");
const CACHE_NAME = "hksilksongcache-v3-venory-fixed"; // v3: fixed loader (preload videos + cache all fetches + retries)

/* ================= FETCH OVERRIDE ================= */
const originalFetch = window.fetch;

window.fetch = async function(resource, options) {
  let url = typeof resource === "string" ? resource : resource.url;
  let cleanPath = url.split("/").pop();

  const cache = await caches.open(CACHE_NAME);

  const cachedResponse = await cache.match(cleanPath);
  if (cachedResponse) {
    return cachedResponse;
  }

  // network with retries, then cache the response so it never needs the network again
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const response = await originalFetch(resource, options);
      if (response && response.ok) {
        try {
          await cache.put(cleanPath, response.clone());
        } catch (e) { /* quota/whatever - ignore */ }
        return response;
      }
      lastErr = new Error("HTTP " + (response ? response.status : "?") + " for " + cleanPath);
    } catch (e) {
      lastErr = e;
    }
    await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
  }
  console.error("[fixed-loader] fetch failed after retries:", cleanPath, lastErr);
  return new Response("fetch failed", { status: 503 });
};

/* ================= CACHE CHECK ================= */
async function isCached() {
  const cache = await caches.open(CACHE_NAME);
  const done = await cache.match("CACHE_COMPLETE");
  return !!done;
}

async function cleanupOldCaches() {
  const cacheNames = await caches.keys();

  await Promise.all(
    cacheNames.map(name => {
      if (name !== CACHE_NAME && name.includes("hksilksong")) {
        console.log("Deleting old cache:", name);
        return caches.delete(name);
      }
    })
  );
}

/* ================= UNZIP ================= */
async function unzipAndStore(zipBlob) {
  if (!zipBlob) {
    throw new Error("ZIP is missing");
  }

  loadingText.textContent = "EXTRACTING ASSETS...";

  const zip = await JSZip.loadAsync(zipBlob);
  const files = Object.values(zip.files).filter(f => !f.dir);
  const total = files.length;

  const cache = await caches.open(CACHE_NAME);

  let processed = 0;
  const batchSize = 10;

  for (let i = 0; i < files.length; i += batchSize) {
    const batch = files.slice(i, i + batchSize);

    await Promise.all(batch.map(async (file) => {
      try {
        const blob = await file.async("blob");
        await cache.put(file.name, new Response(blob));
      } catch (e) {
        console.error("Failed:", file.name, e);
      }

      processed++;
      loadingText.textContent =
        `EXTRACTING ASSETS... (${processed}/${total})`;
    }));

    await new Promise(r => setTimeout(r, 0));
  }

  // ✅ mark cache complete
  await cache.put("CACHE_COMPLETE", new Response("ok"));

  console.log("Cache complete");
}

/* ================= DOWNLOAD ================= */
let loadedBytes = 0;

async function fetchWithProgress(url) {
  const response = await originalFetch(url);

  if (!response.ok) {
    throw new Error("Failed to fetch: " + url);
  }

  const reader = response.body.getReader();
  let chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    received += value.length;
    loadedBytes += value.length;
    chunks.push(value);

    let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
    let mbTotal = '1986.64';

    loadingText.textContent =
      `DOWNLOADING ASSETS... (${mbDone} MB / ${mbTotal} MB)`;
  }

  let fullBuffer = new Uint8Array(received);
  let offset = 0;

  for (let chunk of chunks) {
    fullBuffer.set(chunk, offset);
    offset += chunk.length;
  }

  return fullBuffer.buffer;
}

/* ================= MERGE ================= */
async function mergeFiles(parts) {
  console.log("Downloading parts:", parts.length);

  const buffers = await Promise.all(
    parts.map(part => fetchWithProgress(part))
  );

  return new Blob(buffers);
}

/* ================= PRECACHE HELPERS (fixed loader) ================= */
// Video clips that must be warm in cache before the first cutscene plays.
const VIDEO_CLIPS = [
  "Act_03_Intro","Bellbeast_Travel_Children","Bellbeast_Travel_Children_30",
  "Bellbeast_Travel_Normal","Bellbeast_Travel_Normal_30","Bellhart_Intro",
  "City_Reveal","City_Reveal_Inner","Diving_Bell","Doctor_Cure",
  "Ending_A","Ending_B","Ending_C","Ending_D","Ending_E","Farsight",
  "Intro_Cinematic","Lace_Battle","Last_Dive","Mr_Mushroom",
  "Pinstress_Battle","Plinney_Sharpen","Plinney_Sharpen_Oil",
  "Red_Memory_Ritual","Seamstress_Flash","Slab_Cinematic"
];
// aa/WebGL loose bundles live inside WebGL.zip and are cached on unzip, so
// there is nothing separate to precache here (kept as an explicit empty list
// so the background warm-up is a no-op rather than a ReferenceError).
const LOOSE_BUNDLES = [];

async function precacheFile(relPath) {
  const cache = await caches.open(CACHE_NAME);
  const base = document.querySelector("base").href;
  const url = base + relPath;
  const name = relPath.split("/").pop();
  if (await cache.match(name)) return true;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const response = await originalFetch(url);
      if (response && response.ok) {
        await cache.put(name, response.clone());
        return true;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
  }
  return false;
}

async function precacheVideos() {
  let done = 0;
  for (const v of VIDEO_CLIPS) {
    loadingText.textContent = `PRECACHING CUTSCENES... (${done}/${VIDEO_CLIPS.length})`;
    await precacheFile("StreamingAssets/VideoClip/" + v + ".webm");
    done++;
  }
}

async function precacheLooseBundles() {
  // background, best-effort, does not block game start
  for (const b of LOOSE_BUNDLES) {
    try { await precacheFile("StreamingAssets/aa/WebGL/" + b); } catch (e) {}
    await new Promise(r => setTimeout(r, 50));
  }
  console.log("[fixed-loader] loose bundles precached");
}

/* ================= UTIL ================= */
function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) {
    parts.push(file + ".part" + i);
  }
  return parts;
}

/* ================= MAIN ================= */
(async () => {
  try {
    await cleanupOldCaches(); 
    if (!(await isCached())) {
      loadingText.textContent = "DOWNLOADING ASSETS...";

      const webglzip = await mergeFiles(
        getParts("StreamingAssets/aa/WebGL.zip", 1, 100)
      );

      await unzipAndStore(webglzip);
    } else {
      loadingText.textContent = "LOADING FROM CACHE...";
    }

    /* --- FIXED LOADER: preload cutscene videos (dreamer-class fix) --- */
    await precacheVideos();
    /* background preload of loose bundles (non-blocking) */
    precacheLooseBundles().catch(e => console.error("[fixed-loader] precache loose:", e));

    /* ================= UNITY START ================= */
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function update() {
        warningBanner.style.display =
          warningBanner.children.length ? 'block' : 'none';
      }

      let div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == 'error') {
        div.style = 'background:red;padding:10px;';
      } else {
        if (type == 'warning') {
          div.style = 'background:yellow;padding:10px;';
        }
        setTimeout(() => {
          warningBanner.removeChild(div);
          update();
        }, 5000);
      }

      update();
    }

    const buildUrl = "Build";

    const config = {
      dataUrl: buildUrl + "/w-pt.data.unityweb",
      frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb",
      codeUrl: buildUrl + "/w-pt.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = "Build/w-pt.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      })
      .then((unityInstance) => {
        loadingBar.remove();
        loadingText.remove();
        window.__hkUnity = unityInstance;
        document.getElementById("save-tools").style.display = "block";
        /* apply pending imported save, if any */
        try {
          const pending = localStorage.getItem("venory_pending_save");
          if (pending) {
            const bytes = Uint8Array.from(atob(pending), c => c.charCodeAt(0));
            if (unityInstance.Module && unityInstance.Module.FS) {
              try { unityInstance.Module.FS.writeFile("/idbfs/user0.dat", bytes); } catch (e) {}
              try { unityInstance.Module.FS.writeFile("/user0.dat", bytes); } catch (e) {}
              try { unityInstance.Module.FS.syncfs(false, () => {}); } catch (e) {}
              localStorage.removeItem("venory_pending_save");
              alert("Save imported! Refresh the page and continue your game.");
            }
          }
        } catch (e) { console.error("import apply failed", e); }
        /* FIXED LOADER: keep saves flushed to IndexedDB (fixes 50/50 save loss) */
        const trySync = () => {
          try {
            if (unityInstance.Module && unityInstance.Module.FS && unityInstance.Module.FS.syncfs) {
              unityInstance.Module.FS.syncfs(false, () => {});
            }
          } catch (e) {}
        };
        setInterval(trySync, 10000);
        window.addEventListener("pagehide", () => { trySync(); });
      })
      .catch(alert);
    };

    document.body.appendChild(script);

  } catch (err) {
    console.error(err);
    loadingText.textContent = "ERROR: " + err.message;
  }
})();

/* ===== save import/export tools (fixed loader) ===== */
document.getElementById("btn-export").addEventListener("click", () => {
  try {
    const u = window.__hkUnity;
    if (!u || !u.Module || !u.Module.FS) { alert("Game not ready yet."); return; }
    let bytes = null;
    try { bytes = u.Module.FS.readFile("/idbfs/user0.dat"); } catch (e) {}
    if (!bytes) { try { bytes = u.Module.FS.readFile("/user0.dat"); } catch (e) {} }
    if (!bytes) { alert("No save file found in the virtual filesystem."); return; }
    const blob = new Blob([bytes]);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "silksong-user0.dat";
    a.click();
  } catch (e) { alert("Export failed: " + e); }
});
document.getElementById("btn-import").addEventListener("click", () => {
  document.getElementById("file-import").click();
});
document.getElementById("file-import").addEventListener("change", async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let b64 = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  localStorage.setItem("venory_pending_save", btoa(b64));
  alert("Save queued. If the game is already running, refresh the page to apply it.");
});
document.getElementById("btn-skip").addEventListener("click", async () => {
  try {
    const r = await fetch("./silksong-user0.dat");
    if (!r.ok) { alert("Bundled save not found on server."); return; }
    const buf = await r.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let b64 = "";
    for (let i = 0; i < bytes.length; i += 8192) {
      b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    localStorage.setItem("venory_pending_save", btoa(b64));
    alert("Bundled save queued — reloading to apply it...");
    location.reload();
  } catch (e) { alert("Import failed: " + e); }
});
</script>
  </body>
</html>
